<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MacroPulse — Daily Meal & Macro Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    circle { transition: stroke-dashoffset 0.4s ease; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
          MacroPulse
        </h1>
        <p class="text-xs text-slate-400">Interactive Daily Meal & Macro Calculator</p>
      </div>
      <div class="flex gap-2">
        <button id="toggleTdeeBtn" class="px-4 py-2 text-xs font-semibold rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 transition">
          Calculate TDEE / Edit Goals
        </button>
        <button id="resetDayBtn" class="px-4 py-2 text-xs font-semibold rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 transition">
          Reset Day
        </button>
      </div>
    </header>

    <!-- TDEE Drawer -->
    <div id="tdeeDrawer" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
      <h2 class="text-base font-semibold text-white">TDEE & Macro Target Configurator</h2>
      <div class="grid grid-cols-2 md:grid-cols-6 gap-3 text-xs">
        <div>
          <label class="text-slate-400 block mb-1">Weight (kg)</label>
          <input id="tdeeWeight" type="number" value="70" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" />
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Height (cm)</label>
          <input id="tdeeHeight" type="number" value="174" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" />
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Age</label>
          <input id="tdeeAge" type="number" value="24" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" />
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Activity</label>
          <select id="tdeeActivity" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
            <option value="1.2">Sedentary</option>
            <option value="1.375">Light Active</option>
            <option value="1.55" selected>Moderate (3-5d/wk)</option>
            <option value="1.725">Very Active</option>
          </select>
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Goal</label>
          <select id="tdeeGoal" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
            <option value="-400">Cut (-400 kcal)</option>
            <option value="0" selected>Maintain</option>
            <option value="300">Lean Bulk (+300 kcal)</option>
          </select>
        </div>
        <div class="flex items-end">
          <button id="applyTdeeBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-2 rounded-lg transition">
            Apply TDEE
          </button>
        </div>
      </div>
    </div>

    <!-- Gauges -->
    <div id="gaugesContainer" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

    <!-- Main Content -->
    <div class="grid md:grid-cols-12 gap-6">
      <div class="md:col-span-7 space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-base font-semibold">Food Database</h2>
            <div class="flex items-center gap-2 text-xs">
              <span class="text-slate-400">Log to:</span>
              <select id="mealSelect" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-emerald-400 font-medium">
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Snacks">Snacks</option>
                <option value="Dinner">Dinner</option>
              </select>
              <span class="text-slate-400">Qty:</span>
              <input id="qtyInput" type="number" min="0.5" step="0.5" value="1" class="w-16 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-center text-white" />
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-2">
            <input id="searchInput" type="text" placeholder="Search Idli, Dosa, Paneer, Whey, Oats..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
            <select id="categorySelect" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300">
              <option value="All">All</option>
              <option value="South Indian">South Indian</option>
              <option value="Indian Staples">Indian Staples</option>
              <option value="High Protein">High Protein</option>
              <option value="Beverages">Beverages</option>
              <option value="Snacks">Snacks</option>
              <option value="Custom">Custom</option>
            </select>
          </div>

          <div id="foodList" class="max-h-80 overflow-y-auto space-y-2 pr-1"></div>
        </div>

        <!-- Custom Food Form -->
        <form id="customFoodForm" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
          <h3 class="text-sm font-semibold text-slate-200">Add Custom Food</h3>
          <div class="grid grid-cols-2 sm:grid-cols-6 gap-2 text-xs">
            <input id="cfName" placeholder="Food Name" class="col-span-2 bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" required />
            <input id="cfCals" type="number" placeholder="Calories" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" required />
            <input id="cfProt" type="number" step="0.1" placeholder="Prot (g)" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" />
            <input id="cfCarb" type="number" step="0.1" placeholder="Carb (g)" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" />
            <input id="cfFat" type="number" step="0.1" placeholder="Fat (g)" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" />
          </div>
          <button type="submit" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-emerald-400 transition">
            Save to Custom Foods
          </button>
        </form>
      </div>

      <!-- Meal Breakdown -->
      <div class="md:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
        <h2 class="text-base font-semibold">Today's Meal Breakdown</h2>
        <div id="mealBreakdown" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    const INITIAL_FOODS = [
      { id: '1', name: 'Steamed Idli (2 pcs)', serving: '2 pieces (~80g)', calories: 116, protein: 4, carbs: 24, fat: 0.4, category: 'South Indian' },
      { id: '2', name: 'Bidadi Thatte Idli (1 pc)', serving: '1 large piece (~120g)', calories: 175, protein: 5.5, carbs: 35, fat: 1.2, category: 'South Indian' },
      { id: '3', name: 'Rava Idli (1 pc)', serving: '1 piece (~95g)', calories: 165, protein: 4.2, carbs: 26, fat: 4.8, category: 'South Indian' },
      { id: '4', name: 'Masala Dosa', serving: '1 medium dosa', calories: 340, protein: 7, carbs: 48, fat: 13, category: 'South Indian' },
      { id: '5', name: 'Plain Roast Dosa', serving: '1 dosa', calories: 210, protein: 4.5, carbs: 32, fat: 7, category: 'South Indian' },
      { id: '6', name: 'Sambar', serving: '1 katori (150ml)', calories: 115, protein: 5.5, carbs: 16, fat: 3.2, category: 'South Indian' },
      { id: '7', name: 'Coconut Chutney', serving: '2 tbsp (30g)', calories: 75, protein: 1.2, carbs: 3, fat: 6.5, category: 'South Indian' },
      { id: '8', name: 'Ragi Mudde', serving: '1 ball (150g)', calories: 180, protein: 4.5, carbs: 38, fat: 0.8, category: 'South Indian' },
      { id: '9', name: 'Filter Coffee (with milk)', serving: '1 cup (120ml)', calories: 70, protein: 2.5, carbs: 8, fat: 3.2, category: 'Beverages' },
      { id: '10', name: 'Poha (with peanuts)', serving: '1 bowl (150g)', calories: 250, protein: 5.5, carbs: 42, fat: 7, category: 'Indian Staples' },
      { id: '11', name: 'Paneer Bhurji / Tikka', serving: '150g serving', calories: 330, protein: 22, carbs: 8, fat: 24, category: 'High Protein' },
      { id: '12', name: 'Toor Dal Tadka', serving: '1 bowl (180g)', calories: 195, protein: 9.5, carbs: 26, fat: 6, category: 'Indian Staples' },
      { id: '13', name: 'Chana Masala / Chole', serving: '1 bowl (180g)', calories: 240, protein: 11, carbs: 34, fat: 7, category: 'Indian Staples' },
      { id: '14', name: 'Whole Wheat Roti / Chapati', serving: '1 medium (40g)', calories: 110, protein: 3.5, carbs: 22, fat: 1, category: 'Indian Staples' },
      { id: '15', name: 'Steamed White Rice', serving: '1 bowl (150g cooked)', calories: 195, protein: 4, carbs: 43, fat: 0.4, category: 'Indian Staples' },
      { id: '16', name: 'Whey Protein Isolate', serving: '1 scoop (30g)', calories: 120, protein: 25, carbs: 2, fat: 1, category: 'High Protein' },
      { id: '17', name: 'Boiled Eggs (2 Whole)', serving: '2 large eggs', calories: 140, protein: 12.6, carbs: 1, fat: 10, category: 'High Protein' },
      { id: '18', name: 'Greek Yogurt / Hung Curd', serving: '1 cup (150g)', calories: 100, protein: 15, carbs: 6, fat: 1.5, category: 'High Protein' },
      { id: '19', name: 'Rolled Oats (Dry weight)', serving: '50g', calories: 190, protein: 6.5, carbs: 34, fat: 3.2, category: 'Indian Staples' },
      { id: '20', name: 'Roasted Peanuts / Almonds', serving: '30g handful', calories: 175, protein: 7, carbs: 5, fat: 15, category: 'Snacks' }
    ];

    const MEALS = ['Breakfast', 'Lunch', 'Snacks', 'Dinner'];

    let targets = JSON.parse(localStorage.getItem('mp_targets')) || { calories: 2100, protein: 140, carbs: 230, fat: 65 };
    let logs = JSON.parse(localStorage.getItem('mp_logs')) || [];
    let foods = JSON.parse(localStorage.getItem('mp_foods')) || INITIAL_FOODS;

    function saveState() {
      localStorage.setItem('mp_targets', JSON.stringify(targets));
      localStorage.setItem('mp_logs', JSON.stringify(logs));
      localStorage.setItem('mp_foods', JSON.stringify(foods));
    }

    function createGaugeHTML(label, current, target, unit, color) {
      const radius = 38;
      const circumference = 2 * Math.PI * radius;
      const pct = target > 0 ? Math.min((current / target) * 100, 100) : 0;
      const offset = circumference - (pct / 100) * circumference;
      const diff = target - current;
      const subtext = diff >= 0 ? `${Math.round(diff)}${unit} left` : `${Math.round(Math.abs(diff))}${unit} over`;

      return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col items-center">
          <div class="relative w-24 h-24 flex items-center justify-center">
            <svg class="w-full h-full -rotate-90">
              <circle cx="48" cy="48" r="${radius}" stroke="#1e293b" stroke-width="8" fill="transparent" />
              <circle cx="48" cy="48" r="${radius}" stroke="${color}" stroke-width="8"
                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                stroke-linecap="round" fill="transparent" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span class="text-lg font-bold text-white">${Math.round(current)}</span>
              <span class="text-[11px] text-slate-400">/ ${target}${unit}</span>
            </div>
          </div>
          <span class="mt-2 text-sm font-medium text-slate-300">${label}</span>
          <span class="text-xs text-slate-400">${subtext}</span>
        </div>
      `;
    }

    function renderGauges() {
      const totals = logs.reduce((acc, item) => ({
        calories: acc.calories + item.calories * item.qty,
        protein: acc.protein + item.protein * item.qty,
        carbs: acc.carbs + item.carbs * item.qty,
        fat: acc.fat + item.fat * item.qty,
      }), { calories: 0, protein: 0, carbs: 0, fat: 0 });

      document.getElementById('gaugesContainer').innerHTML =
        createGaugeHTML('Calories', totals.calories, targets.calories, ' kcal', '#10b981') +
        createGaugeHTML('Protein', totals.protein, targets.protein, 'g', '#3b82f6') +
        createGaugeHTML('Carbs', totals.carbs, targets.carbs, 'g', '#f59e0b') +
        createGaugeHTML('Fats', totals.fat, targets.fat, 'g', '#ec4899');
    }

    function renderFoods() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categorySelect').value;
      const filtered = foods.filter(f =>
        f.name.toLowerCase().includes(search) && (cat === 'All' || f.category === cat)
      );

      document.getElementById('foodList').innerHTML = filtered.map(f => `
        <div class="flex items-center justify-between bg-slate-950/70 hover:bg-slate-950 border border-slate-800/80 rounded-xl p-3 transition">
          <div>
            <div class="font-medium text-sm text-white">${f.name}</div>
            <div class="text-xs text-slate-400">
              ${f.serving} • <span class="text-emerald-400">${f.calories} kcal</span> • P: ${f.protein}g | C: ${f.carbs}g | F: ${f.fat}g
            </div>
          </div>
          <button onclick="addFood('${f.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-xs transition">
            + Add
          </button>
        </div>
      `).join('');
    }

    function renderLogs() {
      document.getElementById('mealBreakdown').innerHTML = MEALS.map(meal => {
        const items = logs.filter(l => l.meal === meal);
        const mealCals = items.reduce((s, i) => s + i.calories * i.qty, 0);
        const itemsHTML = items.length === 0
          ? `<p class="text-xs text-slate-500 italic">No items logged yet.</p>`
          : items.map(item => `
              <div class="flex justify-between items-center text-xs bg-slate-900/90 px-2.5 py-1.5 rounded-lg">
                <div>
                  <span class="font-medium text-slate-200">${item.name}</span>
                  <span class="text-slate-400"> × ${item.qty}</span>
                  <div class="text-[11px] text-slate-400">
                    ${Math.round(item.calories * item.qty)} kcal • P:${Math.round(item.protein * item.qty)}g C:${Math.round(item.carbs * item.qty)}g F:${Math.round(item.fat * item.qty)}g
                  </div>
                </div>
                <button onclick="removeLog(${item.logId})" class="text-rose-400 hover:text-rose-300 px-1.5">✕</button>
              </div>
            `).join('');

        return `
          <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-3 space-y-2">
            <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
              <span class="text-sm font-semibold text-slate-200">${meal}</span>
              <span class="text-xs font-medium text-emerald-400">${Math.round(mealCals)} kcal</span>
            </div>
            <div class="space-y-1.5">${itemsHTML}</div>
          </div>
        `;
      }).join('');
    }

    window.addFood = function(id) {
      const food = foods.find(f => f.id === id);
      if (!food) return;
      const meal = document.getElementById('mealSelect').value;
      const qty = parseFloat(document.getElementById('qtyInput').value) || 1;
      logs.push({ ...food, logId: Date.now() + Math.random(), meal, qty });
      saveState();
      renderGauges();
      renderLogs();
    };

    window.removeLog = function(logId) {
      logs = logs.filter(l => l.logId !== logId);
      saveState();
      renderGauges();
      renderLogs();
    };

    document.getElementById('searchInput').addEventListener('input', renderFoods);
    document.getElementById('categorySelect').addEventListener('change', renderFoods);

    document.getElementById('toggleTdeeBtn').addEventListener('click', () => {
      document.getElementById('tdeeDrawer').classList.toggle('hidden');
    });

    document.getElementById('resetDayBtn').addEventListener('click', () => {
      logs = [];
      saveState();
      renderGauges();
      renderLogs();
    });

    document.getElementById('applyTdeeBtn').addEventListener('click', () => {
      const w = parseFloat(document.getElementById('tdeeWeight').value) || 70;
      const h = parseFloat(document.getElementById('tdeeHeight').value) || 174;
      const a = parseFloat(document.getElementById('tdeeAge').value) || 24;
      const act = parseFloat(document.getElementById('tdeeActivity').value) || 1.55;
      const goal = parseFloat(document.getElementById('tdeeGoal').value) || 0;

      const bmr = 10 * w + 6.25 * h - 5 * a + 5;
      const cals = Math.round(bmr * act + goal);
      targets = {
        calories: cals,
        protein: Math.round((cals * 0.30) / 4),
        carbs: Math.round((cals * 0.45) / 4),
        fat: Math.round((cals * 0.25) / 9)
      };
      saveState();
      renderGauges();
      document.getElementById('tdeeDrawer').classList.add('hidden');
    });

    document.getElementById('customFoodForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newFood = {
        id: String(Date.now()),
        name: document.getElementById('cfName').value,
        serving: '1 serving',
        calories: parseFloat(document.getElementById('cfCals').value) || 0,
        protein: parseFloat(document.getElementById('cfProt').value) || 0,
        carbs: parseFloat(document.getElementById('cfCarb').value) || 0,
        fat: parseFloat(document.getElementById('cfFat').value) || 0,
        category: 'Custom'
      };
      foods.unshift(newFood);
      saveState();
      renderFoods();
      e.target.reset();
    });

    renderGauges();
    renderFoods();
    renderLogs();
  </script>
</body>
</html>
